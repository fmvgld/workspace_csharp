<!DOCTYPE html><html lang="fr" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GesCal</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<nav th:replace="~{fragments/common :: nav('home')}"></nav>
<main class="container"><div class="page-head"><div><h1>Tableau de bord</h1><div class="muted">Synthèse de l’activité</div></div><form class="toolbar" method="get"><div><label for="annee">Année</label><input id="annee" name="annee" type="number" th:value="${annee}"></div><button class="btn btn-secondary">Afficher</button></form></div>
<div class="cards"><div class="card metric"><span>Clients</span><strong th:text="${stats.clients}">0</strong></div><div class="card metric"><span>Tournées</span><strong th:text="${stats.tournees}">0</strong></div><div class="card metric"><span>Opérations</span><strong th:text="${stats.operations}">0</strong></div><div class="card metric"><span>Montant total</span><strong th:text="${#numbers.formatDecimal(stats.montant,1,2)} + ' €'">0 €</strong></div><div class="card metric"><span>Reçus à envoyer</span><strong th:text="${stats.recusAEnvoyer}">0</strong></div></div>
<section class="card"><div class="page-head"><h2>Dernières opérations</h2><a class="btn btn-primary" th:href="@{/operations/nouvelle}">Nouvelle opération</a></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Client</th><th>Tournée</th><th class="num">Montant</th><th>Règlement</th></tr></thead><tbody><tr th:each="op:${dernieresOperations}"><td th:text="${op.dateSaisie}"></td><td th:text="${op.nom + ' ' + op.prenom}"></td><td th:text="${op.libelleTournee}"></td><td class="num" th:text="${#numbers.formatDecimal(op.montant,1,2)} + ' €'"></td><td th:text="${op.libelleReglement}"></td></tr><tr th:if="${#lists.isEmpty(dernieresOperations)}"><td class="empty" colspan="5">Aucune opération pour cette année.</td></tr></tbody></table></div></section></main></body></html>
