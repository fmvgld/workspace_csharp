<!DOCTYPE html><html lang="fr" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distribution · GesCal</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><nav th:replace="~{fragments/common :: nav('distributions')}"></nav><main class="container"><h1 th:text="${distribution.id == 0 ? 'Nouvelle distribution' : 'Modifier la distribution'}"></h1><form class="card" style="margin-top:20px" method="post" th:action="@{/distributions/enregistrer}"><input th:if="${distribution.id != 0}" type="hidden" name="id" th:value="${distribution.id}"><div class="form-grid"><div class="span-2"><label>Tournée *</label><select name="tourneeId" required><option value="">Choisir…</option><option th:each="t:${tournees}" th:value="${t.id}" th:selected="${t.id == distribution.tourneeId}" th:text="${t.designation()}"></option></select></div><div><label>Année *</label><input name="annee" type="number" required th:value="${distribution.annee}"></div><div><label>Nombre distribué *</label><input name="nombre" type="number" min="0" required th:value="${distribution.nombre}"></div></div><div class="form-actions"><button class="btn btn-primary">Enregistrer</button><a class="btn btn-secondary" th:href="@{/distributions}">Annuler</a></div></form></main></body></html>
