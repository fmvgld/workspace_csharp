<!DOCTYPE html><html lang="fr" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tournée · GesCal</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><nav th:replace="~{fragments/common :: nav('tournees')}"></nav><main class="container"><div th:replace="~{fragments/common :: messages}"></div><h1 th:text="${tournee.id == 0 ? 'Nouvelle tournée' : 'Modifier la tournée'}"></h1><p class="muted">Le numéro, le libellé et l’année sont obligatoires. Leur combinaison doit être unique.</p><form class="card" style="margin-top:20px" method="post" th:action="@{/tournees/enregistrer}"><input th:if="${tournee.id != 0}" type="hidden" name="id" th:value="${tournee.id}"><div class="form-grid"><div><label>Numéro *</label><input name="numero" type="number" min="1" required th:value="${tournee.numero}"></div><div><label>Année *</label><input name="annee" type="number" min="2000" max="9999" required th:value="${tournee.annee}"></div><div class="span-2"><label>Libellé *</label><input name="libelle" required maxlength="100" th:value="${tournee.libelle}"></div></div><div class="form-actions"><button class="btn btn-primary">Enregistrer</button><a class="btn btn-secondary" th:href="@{/tournees}">Annuler</a></div></form></main></body></html>
