<!DOCTYPE html><html lang="fr" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distributions · GesCal</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><nav th:replace="~{fragments/common :: nav('distributions')}"></nav><main class="container"><div th:replace="~{fragments/common :: messages}"></div><div class="page-head"><div><h1>Distributions</h1><div class="muted" th:text="${#lists.size(distributions)} + ' résultat(s)'"></div></div><a class="btn btn-primary" th:href="@{/distributions/nouvelle}">Nouvelle distribution</a></div><form class="toolbar" method="get"><div><label>Année</label><input name="annee" type="number" th:value="${annee}"></div><button class="btn btn-secondary">Afficher</button><a class="btn btn-secondary" th:href="@{/distributions}">Année de travail</a></form><div class="table-wrap"><table><thead><tr><th>Année</th><th>Tournée</th><th class="num">Nombre distribué</th><th>Actions</th></tr></thead><tbody><tr th:each="d:${distributions}"><td th:text="${d.annee}"></td><td th:text="${d.numeroTournee + ' - ' + d.libelleTournee}"></td><td class="num" th:text="${d.nombre}"></td><td><div class="actions"><a class="btn btn-secondary btn-small" th:href="@{/distributions/{id}/modifier(id=${d.id})}">Modifier</a><form method="post" th:action="@{/distributions/{id}/supprimer(id=${d.id})}" onsubmit="return confirm('Supprimer cette distribution ?')"><button class="btn btn-danger btn-small">Supprimer</button></form></div></td></tr><tr th:if="${#lists.isEmpty(distributions)}"><td class="empty" colspan="4">Aucune distribution.</td></tr></tbody></table></div></main></body></html>
