<!DOCTYPE html><html lang="fr" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opérations · GesCal</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<nav th:replace="~{fragments/common :: nav('operations')}"></nav><main class="container">
<div th:replace="~{fragments/common :: messages}"></div>
<div class="alert alert-error" th:if="${archived}">Cette année est archivée. Les opérations restent consultables mais ne peuvent plus être créées, modifiées ou supprimées.</div>
<div class="page-head"><div><h1>Opérations</h1><div class="muted" th:text="${#lists.size(operations)} + ' résultat(s)'"></div></div><a class="btn btn-primary" th:if="${!archived}" th:href="@{/operations/nouvelle}">Nouvelle opération</a></div>
<form class="toolbar" method="get"><div><label>Année</label><input name="annee" type="number" th:value="${annee}"></div><div class="grow"><label>Recherche</label><input name="q" th:value="${q}" placeholder="Client ou tournée"></div><button class="btn btn-secondary">Afficher</button><a class="btn btn-secondary" th:href="@{/operations}">Effacer</a></form>
<div class="table-wrap"><table class="operations-table"><thead><tr><th>Date</th><th>Client</th><th>Tournée</th><th class="num">Montant</th><th>Règlement</th><th>Reçu</th><th>Enveloppe</th><th>Reçu envoyé</th><th class="operations-actions-column">Actions</th></tr></thead><tbody>
<tr th:each="o:${operations}"><td th:text="${o.dateSaisie}"></td><td th:text="${o.nom + ' ' + o.prenom}"></td><td th:text="${o.numeroTournee + ' - ' + o.libelleTournee}"></td><td class="num" th:text="${#numbers.formatDecimal(o.montant,1,2)} + ' €'"></td><td th:text="${o.libelleReglement}"></td><td><span class="badge" th:classappend="${o.recu} ? 'yes'" th:text="${o.recu ? 'Oui' : 'Non'}"></span></td><td><span class="badge" th:classappend="${o.enveloppe} ? 'yes'" th:text="${o.enveloppe ? 'Oui' : 'Non'}"></span></td><td><span class="badge" th:classappend="${o.recuEnvoye} ? 'yes'" th:text="${o.recuEnvoye ? 'Oui' : 'Non'}"></span></td><td class="operations-actions-column"><div class="actions operations-actions"><a class="btn btn-primary btn-small" target="_blank" th:href="@{/recus/{id}/pdf(id=${o.id})}">Reçu PDF</a><a class="btn btn-secondary btn-small" th:if="${!archived}" th:href="@{/operations/{id}/modifier(id=${o.id})}">Modifier</a><form th:if="${!archived}" method="post" th:action="@{/operations/{id}/supprimer(id=${o.id})}" onsubmit="return confirm('Supprimer cette opération ?')"><button class="btn btn-danger btn-small">Supprimer</button></form><span class="badge" th:if="${archived}">Archivée</span></div></td></tr>
<tr th:if="${#lists.isEmpty(operations)}"><td class="empty" colspan="9">Aucune opération.</td></tr></tbody></table></div></main></body></html>
