<!DOCTYPE html><html lang="fr" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tournées · GesCal</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<nav th:replace="~{fragments/common :: nav('tournees')}"></nav><main class="container"><div th:replace="~{fragments/common :: messages}"></div>
<div class="alert alert-error" th:if="${archived}">Cette année est archivée. Les tournées restent consultables mais ne peuvent plus être créées, modifiées ou supprimées.</div>
<div class="page-head"><div><h1>Tournées</h1><div class="muted" th:text="${#lists.size(tournees)} + ' résultat(s)'"></div></div><a class="btn btn-primary" th:if="${!archived}" th:href="@{/tournees/nouvelle}">Nouvelle tournée</a></div>
<form class="toolbar" method="get"><div><label>Année</label><input name="annee" type="number" th:value="${annee}"></div><button class="btn btn-secondary">Afficher</button><a class="btn btn-secondary" th:href="@{/tournees}">Année de travail</a></form>
<div class="table-wrap"><table><thead><tr><th>Année</th><th>Numéro</th><th>Libellé</th><th>Actions</th></tr></thead><tbody>
<tr th:each="t:${tournees}"><td th:text="${t.annee}"></td><td th:text="${t.numero}"></td><td th:text="${t.libelle}"></td><td><div class="actions" th:if="${!archived}"><a class="btn btn-secondary btn-small" th:href="@{/tournees/{id}/modifier(id=${t.id})}">Modifier</a><form method="post" th:action="@{/tournees/{id}/supprimer(id=${t.id})}" onsubmit="return confirm('Supprimer cette tournée ?')"><button class="btn btn-danger btn-small">Supprimer</button></form></div><span class="badge" th:if="${archived}">Archivée</span></td></tr>
<tr th:if="${#lists.isEmpty(tournees)}"><td class="empty" colspan="4">Aucune tournée.</td></tr></tbody></table></div></main></body></html>
