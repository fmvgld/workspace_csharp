spring.application.name=GesCal
server.port=8081
spring.config.import=optional:file:./config/gescal.properties
gescal.config.path=./config/gescal.properties

# La base existante reste la source de vérité : aucune création automatique de schéma.
spring.datasource.url=jdbc:sqlite:${gescal.database.path}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

gescal.database.path=${GESCAL_DATABASE_PATH:C:/Users/fmv/OneDrive/DATA/gescal.db}
gescal.working-year=${GESCAL_WORKING_YEAR:0}
gescal.backup.directory=C:/Users/fmv/OneDrive/DATA/Save
gescal.export.directory=C:/Users/fmv/OneDrive/DATA/Export
gescal.receipt.directory=C:/Users/fmv/OneDrive/DATA/Recus
gescal.receipt.logo=C:/image/Sans titre.png
gescal.receipt.signature=C:/image/signature john.jpg

# Journalisation fichier. Le chemin peut être remplacé dans config/gescal.properties
# ou avec la variable d'environnement GESCAL_LOG_PATH.
gescal.log.path=${GESCAL_LOG_PATH:C:/Users/fmv/OneDrive/DATA/Logs/gescal.log}
logging.file.name=${gescal.log.path}
logging.level.root=INFO
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=300MB

# L'envoi reste volontairement désactivé sans configuration explicite.
gescal.mail.enabled=${GESCAL_MAIL_ENABLED:true}
spring.mail.host=${GESCAL_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${GESCAL_SMTP_PORT:587}
spring.mail.username=${GESCAL_SMTP_USERNAME:amicalespjarrie18@gmail.com}
spring.mail.password=${GESCAL_SMTP_PASSWORD:fjbdbivxpvwulybk}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${GESCAL_SMTP_HOST:smtp.gmail.com}

spring.thymeleaf.cache=false
server.error.include-message=always
